<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Vocabulary Mastery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
</head>
<body>
    <header>
        <h1>🧠 IELTS Vocabulary Mastery</h1>
        <button id="theme-toggle" aria-label="Toggle light/dark mode">🌙</button>
    </header>

    <nav id="set-navigation">
        <!-- Navigation buttons will be generated by JS -->
    </nav>

    <main>
        <div class="controls">
             <h2 id="current-set-title">Set 1</h2>
             <button id="recall-button">Recall Mode</button>
        </div>
        <div id="vocabulary-list" class="vocab-grid">
            <!-- Vocabulary cards will be generated by JS -->
        </div>
         <div class="pagination">
            <button id="prev-set" disabled>« Previous Set</button>
            <button id="next-set">Next Set »</button>
        </div>
    </main>

    <footer>
        <p>© 2023 IELTS Vocabulary Mastery. Learn Smarter.</p>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
